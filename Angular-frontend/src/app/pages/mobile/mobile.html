<div class="container my-4">
  
  <!-- Sort and Header Bar -->
  <div class="d-flex justify-content-between align-items-center mb-4 bg-light p-3 rounded shadow-sm">
    <h4 class="mb-0 fw-bold">📱 Mobile Phones</h4>
    <div class="d-flex align-items-center gap-2">
      <label for="mobileSortSelect" class="form-label mb-0 text-nowrap fw-semibold">Sort by Price:</label>
      <select id="mobileSortSelect" class="form-select" [value]="sortOption" (change)="onSortChange($event)" style="width: auto;">
        <option value="">Default</option>
        <option value="price_asc">Low to High</option>
        <option value="price_desc">High to Low</option>
      </select>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 justify-content-center">
    @for (item of data; track item.id) {
      <div class="col d-flex justify-content-center">
        <app-cards [product]="item"></app-cards>
      </div>
    } @empty {
      <div class="col-12 py-5">
        <div class="alert alert-dark d-flex align-items-center justify-content-center" role="alert">
          <span class="spinner-grow spinner-grow-sm me-2" role="status" aria-hidden="true"></span>
          <span>No products found matching criteria. Loading...</span>
        </div>
      </div>
    }
  </div>
</div>
